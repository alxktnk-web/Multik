<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Мультик</title>
    <style>
      :root { color-scheme: light dark; --bg: #f4f1ec; --fg: #1d1b19; --muted: #6b655e; --accent: #c2410c; }
      @media (prefers-color-scheme: dark) { :root { --bg: #141210; --fg: #ece6dd; --muted: #9b948a; --accent: #fb923c; } }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, system-ui, sans-serif; }
      main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
      h1 { margin: 0 0 8px; font-size: 32px; }
      p { color: var(--muted); }
      a.btn { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 12px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Мультик</h1>
      <p>Плёночная двойная экспозиция из фото с iPhone. Приложение ещё в работе — сейчас доступна лаборатория для подбора вида.</p>
      <a class="btn" href="./lab/">Открыть лабораторию</a>
    </main>
  </body>
</html>
